{% extends 'base.html' %}

{% block content %}
<div style="max-width: 600px; margin: 1.5rem auto;">
    <div class="content-card">
        <div class="card-header">
            <h2 class="card-title">{{ title }}</h2>
            <a href="{% url 'sla:list' %}" class="btn btn-outline btn-sm">Cancel</a>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <div class="form-group">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}<div class="form-error">{{ field.errors.0 }}</div>{% endif %}
                    </div>
                {% endfor %}
                <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem;">
                    <a href="{% url 'sla:list' %}" class="btn btn-outline">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save SLA Policy</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
